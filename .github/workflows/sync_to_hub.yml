name: Sync to Hugging Face Hub
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://dharun-projects:$HF_TOKEN@huggingface.co/spaces/dharun-projects/AI-ticket-router
          git push --force hf HEAD:main
